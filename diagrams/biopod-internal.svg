<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="podGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8e6c9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sensorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff3e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffcc02;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="powerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f3e5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e1bee7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bioGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bbdefb;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="800" fill="#f5f5f5"/>
  
  <!-- Title -->
  <text x="500" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Smart Bio-Pod (SBP) Internal Architecture
  </text>
  
  <!-- Main Pod Housing -->
  <ellipse cx="500" cy="400" rx="400" ry="300" fill="url(#podGrad)" stroke="#4caf50" stroke-width="3"/>
  <text x="500" y="110" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#4caf50">
    Weather-Resistant Housing (IP67)
  </text>
  
  <!-- Solar Panel Section -->
  <rect x="200" y="130" width="600" height="40" fill="url(#powerGrad)" stroke="#7b1fa2" stroke-width="2" rx="5"/>
  <text x="500" y="155" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#7b1fa2">
    Solar Panel Array (300W, Monocrystalline)
  </text>
  
  <!-- Hyperspectral Camera -->
  <rect x="150" y="200" width="200" height="80" fill="url(#sensorGrad)" stroke="#ff9800" stroke-width="2" rx="5"/>
  <text x="250" y="220" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ff9800">
    Hyperspectral Camera
  </text>
  <text x="170" y="240" font-family="Arial, sans-serif" font-size="10" fill="#555">• Spectral range: 400-2500nm</text>
  <text x="170" y="255" font-family="Arial, sans-serif" font-size="10" fill="#555">• Resolution: 1920x1200</text>
  <text x="170" y="270" font-family="Arial, sans-serif" font-size="10" fill="#555">• 240 spectral bands</text>
  
  <!-- Raman Spectroscopy Sensor -->
  <rect x="650" y="200" width="200" height="80" fill="url(#sensorGrad)" stroke="#ff9800" stroke-width="2" rx="5"/>
  <text x="750" y="220" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ff9800">
    Raman Spectroscopy
  </text>
  <text x="670" y="240" font-family="Arial, sans-serif" font-size="10" fill="#555">• Laser: 785nm</text>
  <text x="670" y="255" font-family="Arial, sans-serif" font-size="10" fill="#555">• Molecular identification</text>
  <text x="670" y="270" font-family="Arial, sans-serif" font-size="10" fill="#555">• 0.1μm particles</text>
  
  <!-- Environmental Sensors Cluster -->
  <rect x="400" y="200" width="200" height="80" fill="url(#sensorGrad)" stroke="#ff9800" stroke-width="2" rx="5"/>
  <text x="500" y="220" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ff9800">
    Environmental Sensors
  </text>
  <text x="420" y="240" font-family="Arial, sans-serif" font-size="10" fill="#555">• pH, Turbidity, Conductivity</text>
  <text x="420" y="255" font-family="Arial, sans-serif" font-size="10" fill="#555">• Temperature, Pressure</text>
  <text x="420" y="270" font-family="Arial, sans-serif" font-size="10" fill="#555">• Dissolved Oxygen</text>
  
  <!-- NVIDIA Jetson Orin Nano Processing Unit -->
  <rect x="300" y="320" width="400" height="100" fill="#fff" stroke="#1976d2" stroke-width="2" rx="5"/>
  <text x="500" y="345" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1976d2">
    NVIDIA Jetson Orin Nano (8GB)
  </text>
  <text x="320" y="365" font-family="Arial, sans-serif" font-size="10" fill="#555">• ARM Cortex-A78AE CPU (6-core)</text>
  <text x="320" y="380" font-family="Arial, sans-serif" font-size="10" fill="#555">• Ampere GPU (1024 CUDA cores)</text>
  <text x="320" y="395" font-family="Arial, sans-serif" font-size="10" fill="#555">• 20 TOPS AI performance</text>
  <text x="320" y="410" font-family="Arial, sans-serif" font-size="10" fill="#555">• Edge AI inference, Real-time processing</text>
  
  <!-- Bioreactor Chamber -->
  <rect x="150" y="450" width="300" height="120" fill="url(#bioGrad)" stroke="#1976d2" stroke-width="2" rx="5"/>
  <text x="300" y="475" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1976d2">
    Bioreactor Chamber (500ml)
  </text>
  <text x="170" y="495" font-family="Arial, sans-serif" font-size="10" fill="#555">• Bacterial cultivation system</text>
  <text x="170" y="510" font-family="Arial, sans-serif" font-size="10" fill="#555">• Temperature control (±0.1°C)</text>
  <text x="170" y="525" font-family="Arial, sans-serif" font-size="10" fill="#555">• pH regulation (6.5-8.5)</text>
  <text x="170" y="540" font-family="Arial, sans-serif" font-size="10" fill="#555">• Automated nutrient dosing</text>
  <text x="170" y="555" font-family="Arial, sans-serif" font-size="10" fill="#555">• Precision release mechanism</text>
  
  <!-- Communication Modules -->
  <rect x="550" y="450" width="300" height="120" fill="#fff" stroke="#4caf50" stroke-width="2" rx="5"/>
  <text x="700" y="475" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#4caf50">
    Communication Modules
  </text>
  <text x="570" y="495" font-family="Arial, sans-serif" font-size="10" fill="#555">• LoRaWAN (10km range)</text>
  <text x="570" y="510" font-family="Arial, sans-serif" font-size="10" fill="#555">• 4G/5G cellular (backup)</text>
  <text x="570" y="525" font-family="Arial, sans-serif" font-size="10" fill="#555">• Satellite uplink (Iridium)</text>
  <text x="570" y="540" font-family="Arial, sans-serif" font-size="10" fill="#555">• Mesh networking (802.11ah)</text>
  <text x="570" y="555" font-family="Arial, sans-serif" font-size="10" fill="#555">• AES-256 encryption</text>
  
  <!-- Power Management System -->
  <rect x="100" y="600" width="200" height="100" fill="url(#powerGrad)" stroke="#7b1fa2" stroke-width="2" rx="5"/>
  <text x="200" y="625" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#7b1fa2">
    Power Management
  </text>
  <text x="120" y="645" font-family="Arial, sans-serif" font-size="10" fill="#555">• 300W Solar panel</text>
  <text x="120" y="660" font-family="Arial, sans-serif" font-size="10" fill="#555">• 10W Micro-hydro turbine</text>
  <text x="120" y="675" font-family="Arial, sans-serif" font-size="10" fill="#555">• 100Ah LiFePO4 battery</text>
  <text x="120" y="690" font-family="Arial, sans-serif" font-size="10" fill="#555">• 7-day autonomy</text>
  
  <!-- Self-Cleaning System -->
  <rect x="350" y="600" width="200" height="100" fill="#fff" stroke="#f44336" stroke-width="2" rx="5"/>
  <text x="450" y="625" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#f44336">
    Self-Cleaning System
  </text>
  <text x="370" y="645" font-family="Arial, sans-serif" font-size="10" fill="#555">• Ultrasonic cleaning</text>
  <text x="370" y="660" font-family="Arial, sans-serif" font-size="10" fill="#555">• UV sterilization</text>
  <text x="370" y="675" font-family="Arial, sans-serif" font-size="10" fill="#555">• Automated lens wiper</text>
  <text x="370" y="690" font-family="Arial, sans-serif" font-size="10" fill="#555">• Antifouling coating</text>
  
  <!-- Data Storage -->
  <rect x="600" y="600" width="200" height="100" fill="#fff" stroke="#9c27b0" stroke-width="2" rx="5"/>
  <text x="700" y="625" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#9c27b0">
    Data Storage
  </text>
  <text x="620" y="645" font-family="Arial, sans-serif" font-size="10" fill="#555">• 1TB NVMe SSD</text>
  <text x="620" y="660" font-family="Arial, sans-serif" font-size="10" fill="#555">• Edge caching (7 days)</text>
  <text x="620" y="675" font-family="Arial, sans-serif" font-size="10" fill="#555">• Data compression</text>
  <text x="620" y="690" font-family="Arial, sans-serif" font-size="10" fill="#555">• Redundant backup</text>
  
  <!-- Safety Systems -->
  <rect x="820" y="600" width="150" height="100" fill="#ffebee" stroke="#f44336" stroke-width="2" rx="5"/>
  <text x="895" y="625" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#f44336">
    Safety Systems
  </text>
  <text x="840" y="645" font-family="Arial, sans-serif" font-size="10" fill="#555">• Emergency shutdown</text>
  <text x="840" y="660" font-family="Arial, sans-serif" font-size="10" fill="#555">• Leak detection</text>
  <text x="840" y="675" font-family="Arial, sans-serif" font-size="10" fill="#555">• Tamper protection</text>
  <text x="840" y="690" font-family="Arial, sans-serif" font-size="10" fill="#555">• Remote monitoring</text>
  
  <!-- Data Flow Arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f44336"/>
    </marker>
  </defs>
  
  <!-- Sensor to Processing arrows -->
  <line x1="250" y1="280" x2="400" y2="350" stroke="#f44336" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="280" x2="500" y2="320" stroke="#f44336" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="750" y1="280" x2="600" y2="350" stroke="#f44336" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Processing to Bioreactor arrow -->
  <line x1="350" y1="420" x2="350" y2="450" stroke="#f44336" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Processing to Communication arrow -->
  <line x1="650" y1="420" x2="650" y2="450" stroke="#f44336" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Power connections -->
  <line x1="200" y1="600" x2="400" y2="420" stroke="#7b1fa2" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="250" y1="600" x2="650" y2="450" stroke="#7b1fa2" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Technical Specifications Box -->
  <rect x="50" y="720" width="900" height="70" fill="#fff" stroke="#666" stroke-width="1" rx="5"/>
  <text x="70" y="740" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Technical Specifications:</text>
  
  <text x="70" y="760" font-family="Arial, sans-serif" font-size="10" fill="#555">Dimensions: 80cm (dia) × 60cm (height) | Weight: 45kg | Operating Range: -20°C to +60°C | IP67 Rating</text>
  <text x="70" y="775" font-family="Arial, sans-serif" font-size="10" fill="#555">Detection Range: 0.1μm - 5mm particles | Processing: 20 TOPS AI | Storage: 1TB | Power: 7-day autonomy | Communication: 10km LoRaWAN</text>
  
  <!-- Deployment Depth Indicator -->
  <line x1="50" y1="400" x2="90" y2="400" stroke="#333" stroke-width="2"/>
  <text x="30" y="350" font-family="Arial, sans-serif" font-size="10" fill="#555" transform="rotate(-90 30 350)">Deployment Depth</text>
  <text x="30" y="405" font-family="Arial, sans-serif" font-size="10" fill="#555" transform="rotate(-90 30 405)">0.5m - 30m</text>
  
  <!-- Operating Status LEDs -->
  <circle cx="120" cy="150" r="8" fill="#4caf50"/>
  <text x="140" y="155" font-family="Arial, sans-serif" font-size="10" fill="#555">Operational</text>
  
  <circle cx="220" cy="150" r="8" fill="#ff9800"/>
  <text x="240" y="155" font-family="Arial, sans-serif" font-size="10" fill="#555">Maintenance</text>
  
  <circle cx="320" cy="150" r="8" fill="#f44336"/>
  <text x="340" y="155" font-family="Arial, sans-serif" font-size="10" fill="#555">Alert</text>
</svg>