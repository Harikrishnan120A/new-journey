  <line x1="770" y1="630" x2="690" y2="720" stroke="#d32f2f" stroke-width="3" marker-end="url(#arrowGreen)"/>
  
  <!-- Citizen App Feedback Loop -->
  <path d="M 250 720 Q 100 650 170 180" fill="none" stroke="#388e3c" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowGreen)"/>
  
  <!-- Data Volume Indicators -->
  <text x="50" y="820" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Data Volume Specifications:</text>
  <text x="50" y="840" font-family="Arial, sans-serif" font-size="10" fill="#555">• Total Daily Input: ~500GB | Edge Processing: 20 TOPS | Cloud Storage: 10TB/day | Real-time Latency: &lt;100ms</text>
  <text x="50" y="855" font-family="Arial, sans-serif" font-size="10" fill="#555">• Alert Response Time: &lt;30 seconds | Data Retention: 5 years | Backup: 3x redundancy | Encryption: AES-256</text>
  <text x="50" y="870" font-family="Arial, sans-serif" font-size="10" fill="#555">• API Throughput: 10K requests/sec | Citizen App Users: 1M+ | Research Data Sharing: Open API with authentication</text>
</svg>