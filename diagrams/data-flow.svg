  <text x="250" y="750" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#555">AI validation, GPS tagging</text>
  
  <rect x="370" y="720" width="200" height="40" fill="#fff" stroke="#388e3c" stroke-width="1" rx="5"/>
  <text x="470" y="735" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#388e3c">Real-time Updates</text>
  <text x="470" y="750" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#555">Contamination maps, status</text>
  
  <rect x="590" y="720" width="200" height="40" fill="#fff" stroke="#388e3c" stroke-width="1" rx="5"/>
  <text x="690" y="735" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#388e3c">Community Reports</text>
  <text x="690" y="750" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#555">Local observations, crowdsourcing</text>
  
  <rect x="810" y="720" width="200" height="40" fill="#fff" stroke="#388e3c" stroke-width="1" rx="5"/>
  <text x="910" y="735" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#388e3c">Remediation Status</text>
  <text x="910" y="750" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#555">Cleanup progress, effectiveness</text>
  
  <!-- Data Flow Arrows -->
  <!-- Collection to Edge Processing -->
  <line x1="170" y1="180" x2="180" y2="270" stroke="#1976d2" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <line x1="370" y1="180" x2="400" y2="270" stroke="#1976d2" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <line x1="570" y1="180" x2="620" y2="270" stroke="#1976d2" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <line x1="770" y1="180" x2="840" y2="270" stroke="#1976d2" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <line x1="970" y1="180" x2="1050" y2="270" stroke="#1976d2" stroke-width="3" marker-end="url(#arrowBlue)"/>
  
  <!-- Edge to Cloud Processing -->
  <line x1="180" y1="330" x2="180" y2="420" stroke="#ff9800" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <line x1="400" y1="330" x2="400" y2="420" stroke="#ff9800" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <line x1="620" y1="330" x2="620" y2="420" stroke="#ff9800" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <line x1="840" y1="330" x2="840" y2="420" stroke="#ff9800" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <line x1="1050" y1="330" x2="1050" y2="420" stroke="#ff9800" stroke-width="3" marker-end="url(#arrowBlue)"/>
  
  <!-- Cloud to Alert Systems -->
  <line x1="180" y1="480" x2="170" y2="570" stroke="#1976d2" stroke-width="3" marker-end="url(#arrowRed)"/>
  <line x1="400" y1="480" x2="370" y2="570" stroke="#1976d2" stroke-width="3" marker-end="url(#arrowRed)"/>
  <line x1="620" y1="480" x2="570" y2="570" stroke="#1976d2" stroke-width="3" marker-end="url(#arrowRed)"/>
  <line x1="840" y1="480" x2="770" y2="570" stroke="#1976d2" stroke-width="3" marker-end="url(#arrowRed)"/>
  <line x1="1050" y1="480" x2="970" y2="570" stroke="#1976d2" stroke-width="3" marker-end="url(#arrowRed)"/>
  
