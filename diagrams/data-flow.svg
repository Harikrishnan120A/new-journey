  <text x="770" y="605" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#555">Mobile notifications</text>
  <text x="770" y="620" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#555">Emergency broadcast</text>
  
  <rect x="880" y="570" width="180" height="60" fill="#fff" stroke="#d32f2f" stroke-width="1" rx="5"/>
  <text x="970" y="590" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#d32f2f">Research Sharing</text>
