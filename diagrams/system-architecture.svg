  <line x1="550" y1="430" x2="400" y2="345" stroke="#ff5722" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="870" y1="430" x2="600" y2="345" stroke="#ff5722" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Network to Cloud arrows -->
  <line x1="200" y1="295" x2="180" y2="230" stroke="#ff5722" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="295" x2="400" y2="230" stroke="#ff5722" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="295" x2="620" y2="230" stroke="#ff5722" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="800" y1="295" x2="840" y2="230" stroke="#ff5722" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Health Authorities Integration -->
