  <text x="870" y="450" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#7b1fa2">Mobile Remediation Drone (MRD)</text>
  <text x="740" y="470" font-family="Arial, sans-serif" font-size="10" fill="#555">• GPS + LIDAR navigation</text>
  <text x="740" y="485" font-family="Arial, sans-serif" font-size="10" fill="#555">• Water filtration modules</text>
  <text x="740" y="500" font-family="Arial, sans-serif" font-size="10" fill="#555">• Swarm coordination AI</text>
  <text x="740" y="515" font-family="Arial, sans-serif" font-size="10" fill="#555">• Emergency response capability</text>
  <text x="740" y="530" font-family="Arial, sans-serif" font-size="10" fill="#555">• 45-min flight time</text>
  
