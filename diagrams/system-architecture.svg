<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bbdefb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="deviceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f3e5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e1bee7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="networkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8e6c9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="#f9f9f9"/>
  
  <!-- Title -->
  <text x="600" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    EcoPlast-AI Intelligent Microplastic Bio-Remediation Network
  </text>
  
  <!-- Cloud Infrastructure Section -->
  <rect x="50" y="80" width="1100" height="150" fill="url(#cloudGrad)" stroke="#1976d2" stroke-width="2" rx="10"/>
  <text x="70" y="105" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1976d2">Cloud Infrastructure</text>
  
  <!-- AI Processing -->
  <rect x="80" y="120" width="200" height="80" fill="#fff" stroke="#1976d2" stroke-width="1" rx="5"/>
  <text x="180" y="140" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1976d2">PlasticVision AI</text>
  <text x="180" y="155" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555">Real-time Detection</text>
  <text x="180" y="170" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555">Pattern Recognition</text>
  <text x="180" y="185" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555">NVIDIA GPU Cluster</text>
  
  <!-- BioMatch Optimization -->
  <rect x="300" y="120" width="200" height="80" fill="#fff" stroke="#1976d2" stroke-width="1" rx="5"/>
  <text x="400" y="140" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1976d2">BioMatch Optimization</text>
  <text x="400" y="155" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555">Bacterial Selection</text>
  <text x="400" y="170" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555">Deployment Strategy</text>
  <text x="400" y="185" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555">ML Algorithms</text>
  
  <!-- EcoPredict Network -->
  <rect x="520" y="120" width="200" height="80" fill="#fff" stroke="#1976d2" stroke-width="1" rx="5"/>
  <text x="620" y="140" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1976d2">EcoPredict Network</text>
  <text x="620" y="155" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555">Contamination Spread</text>
  <text x="620" y="170" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555">Risk Assessment</text>
  <text x="620" y="185" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555">Predictive Modeling</text>
  
  <!-- Data Storage -->
  <rect x="740" y="120" width="200" height="80" fill="#fff" stroke="#1976d2" stroke-width="1" rx="5"/>
  <text x="840" y="140" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1976d2">Data Storage & Analytics</text>
  <text x="840" y="155" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555">Time-series Database</text>
  <text x="840" y="170" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555">Real-time Processing</text>
  <text x="840" y="185" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555">Apache Kafka + InfluxDB</text>
  
  <!-- Citizen Science Platform -->
  <rect x="960" y="120" width="170" height="80" fill="#fff" stroke="#1976d2" stroke-width="1" rx="5"/>
  <text x="1045" y="140" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1976d2">Citizen Science</text>
  <text x="1045" y="155" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555">Mobile App</text>
  <text x="1045" y="170" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555">Community Reports</text>
  <text x="1045" y="185" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555">Data Crowdsourcing</text>
  
  <!-- Communication Networks Section -->
  <rect x="50" y="260" width="1100" height="100" fill="url(#networkGrad)" stroke="#388e3c" stroke-width="2" rx="10"/>
  <text x="70" y="285" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#388e3c">Communication Networks</text>
  
  <!-- LoRaWAN -->
  <ellipse cx="200" cy="320" rx="80" ry="25" fill="#fff" stroke="#388e3c" stroke-width="1"/>
  <text x="200" y="318" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#388e3c">LoRaWAN</text>
  <text x="200" y="330" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555">Long-range IoT</text>
  
  <!-- 4G/5G -->
  <ellipse cx="400" cy="320" rx="80" ry="25" fill="#fff" stroke="#388e3c" stroke-width="1"/>
  <text x="400" y="318" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#388e3c">4G/5G Cellular</text>
  <text x="400" y="330" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555">High-bandwidth</text>
  
  <!-- Satellite -->
  <ellipse cx="600" cy="320" rx="80" ry="25" fill="#fff" stroke="#388e3c" stroke-width="1"/>
  <text x="600" y="318" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#388e3c">Satellite</text>
  <text x="600" y="330" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555">Remote areas</text>
  
  <!-- Mesh Network -->
  <ellipse cx="800" cy="320" rx="80" ry="25" fill="#fff" stroke="#388e3c" stroke-width="1"/>
  <text x="800" y="318" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#388e3c">Mesh Network</text>
  <text x="800" y="330" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555">Device-to-device</text>
  
  <!-- Edge Encryption -->
  <ellipse cx="1000" cy="320" rx="80" ry="25" fill="#fff" stroke="#388e3c" stroke-width="1"/>
  <text x="1000" y="318" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#388e3c">Edge Encryption</text>
  <text x="1000" y="330" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555">AES-256</text>
  
  <!-- Hardware Components Section -->
  <rect x="50" y="390" width="1100" height="180" fill="url(#deviceGrad)" stroke="#7b1fa2" stroke-width="2" rx="10"/>
  <text x="70" y="415" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#7b1fa2">Hardware Components</text>
  
  <!-- Smart Bio-Pod -->
  <rect x="80" y="430" width="300" height="120" fill="#fff" stroke="#7b1fa2" stroke-width="1" rx="5"/>
  <text x="230" y="450" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#7b1fa2">Smart Bio-Pod (SBP)</text>
  <text x="100" y="470" font-family="Arial, sans-serif" font-size="10" fill="#555">• Hyperspectral camera (400-2500nm)</text>
  <text x="100" y="485" font-family="Arial, sans-serif" font-size="10" fill="#555">• Raman spectroscopy sensor</text>
  <text x="100" y="500" font-family="Arial, sans-serif" font-size="10" fill="#555">• NVIDIA Jetson Orin Nano</text>
  <text x="100" y="515" font-family="Arial, sans-serif" font-size="10" fill="#555">• Solar panel + micro-hydro</text>
  <text x="100" y="530" font-family="Arial, sans-serif" font-size="10" fill="#555">• Bacterial deployment system</text>
  
  <!-- Soil Sentinel Probe -->
  <rect x="400" y="430" width="300" height="120" fill="#fff" stroke="#7b1fa2" stroke-width="1" rx="5"/>
  <text x="550" y="450" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#7b1fa2">Soil Sentinel Probe (SSP)</text>
  <text x="420" y="470" font-family="Arial, sans-serif" font-size="10" fill="#555">• Ground-penetrating sensors</text>
  <text x="420" y="485" font-family="Arial, sans-serif" font-size="10" fill="#555">• Underground placement mechanism</text>
  <text x="420" y="500" font-family="Arial, sans-serif" font-size="10" fill="#555">• Microorganism release system</text>
  <text x="420" y="515" font-family="Arial, sans-serif" font-size="10" fill="#555">• Low-power communication</text>
  <text x="420" y="530" font-family="Arial, sans-serif" font-size="10" fill="#555">• 3-year battery life</text>
  
  <!-- Mobile Remediation Drone -->
